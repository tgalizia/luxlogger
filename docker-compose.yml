services:
  advisor:
    build: .
    container_name: luxtronik-advisor
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./.env:/app/.env:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
