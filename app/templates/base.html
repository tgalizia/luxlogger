{% import "macros.html" as ui %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Luxlogger{% endblock %}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/static/favicon.png" type="image/png" sizes="32x32" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="/static/app.css?v=11" />
    {% block head %}{% endblock %}
  </head>
  <body>
    {{ ui.toolbar(refresh_seconds|default(60), active|default("")) }}
    <main{% block main_attrs %}{% endblock %}>
      {% block body %}{% endblock %}
    </main>
    <script src="/static/toolbar.js?v=7"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
